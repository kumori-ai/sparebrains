# The automation sweep on google-deepmind/formal-conjectures (task #478; tools/fc_sweep.py): their textbook and test
# declarations still at `sorry`, our loop's closers, checked in their own build with #print axioms. Read-only toward
# their repository: results land in our ledger; any PR is Andy's call. Dispatch by hand.
name: fc-sweep

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "declarations to sweep (blank = all)"
        default: ""

permissions:
  contents: write        # publish the ledger rows

concurrency:
  group: fc-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: formal-conjectures at the pinned commit
        run: |
          fc=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import fc_sweep; print(fc_sweep.FC_COMMIT)")
          git init -q fc && git -C fc fetch -q --depth 1 https://github.com/google-deepmind/formal-conjectures.git "$fc"
          git -C fc checkout -q FETCH_HEAD && git -C fc log -1 --format='formal-conjectures %H %cI'

      - name: elan (as their CI installs it)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/mathlib
          key: fc-mathlib-${{ hashFiles('fc/lean-toolchain', 'fc/lake-manifest.json') }}

      - name: their build
        uses: actions/cache@v5
        with:
          path: fc/.lake/build
          key: fc-build-${{ hashFiles('fc/lean-toolchain', 'fc/lake-manifest.json', 'fc/lakefile.toml') }}

      - name: build FormalConjecturesUtil
        working-directory: fc
        run: |
          lake exe cache get
          ./scripts/mk_all_formathlib.sh
          lake build FormalConjecturesUtil

      - name: sweep
        shell: bash                 # -eo pipefail: a failed sweep must fail the step, not hide behind tee
        run: |
          python3 tools/fc_sweep.py --fc fc --out "ledger/fc/sweep-${GITHUB_RUN_ID}.jsonl" \
            $( [ -n "${{ inputs.limit }}" ] && echo --limit "${{ inputs.limit }}" ) | tee "$RUNNER_TEMP/out.txt"
          echo "SUMMARY=$(tail -1 "$RUNNER_TEMP/out.txt" | cut -c1-300)" >> "$GITHUB_ENV"

      - name: publish the ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "ledger/fc/sweep-${GITHUB_RUN_ID}.jsonl" ] || exit 0
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "fc sweep $GITHUB_RUN_ID: $SUMMARY

          Generated-by: no model; subgoals.AUTO_TACTICS via tools/fc_sweep.py, cost \$0; checked in google-deepmind/formal-conjectures' own build (Lean v4.33.1) with #print axioms"
