# Step 3 of PLAN.md §2: the loop. The free pool proposes, the kernel disposes, the
# ledger remembers. Since 2026-09-02 it runs around the clock: each job works the
# ladder (tools/ladder.py) for its wall-clock budget, commits what it learned, and
# dispatches the next job while work remains; the two-hourly schedule is the backstop
# that restarts the chain if a job dies. The pool caps are per UTC day, so a job that
# finds nothing answerable exits and the next one picks up after the reset.
name: attempt

on:
  schedule:
    - cron: "0 */2 * * *"
    - cron: "30 */2 * * *"      # stage 2: the relay takes the next open problem (DECISIONS.md 2026-10-06)
  workflow_dispatch:
    inputs:
      fixer_target:
        description: "issue #3: <set>/<target> whose closest misses get their layout repaired and re-judged (no model call)"
        default: ""
      relay_target:
        description: "stage 2: <set>/<target> to relay from its dossier (e.g. mil/mil_c05_s01_ex03); set = relay run, ladder ignored"
        default: ""
      ladder:
        description: "run the 24/7 ladder (every lane × every target, owed cells only); off = the knobs below"
        type: boolean
        default: true
      sample:
        description: "how many targets (seeded sample)"
        default: "5"
      seed:
        default: "1"
      order:
        description: "walk lanes by tier: asc = tiny first, desc = frontier first"
        type: choice
        options: [asc, desc]
        default: asc
      stop_on_accept:
        description: "ladder mode: stop a target at its first verified proof"
        type: boolean
        default: true
      lanes:
        description: "comma-separated backend names; empty = every live lane"
        default: ""
      attempts:
        default: "1"
      min_tier:
        description: "drop lanes below this tier (sweep runs: medium)"
        type: choice
        options: ["", tiny, low, medium, high, frontier]
        default: ""
      skip_benched:
        description: "skip lanes the router currently refuses"
        type: boolean
        default: true
      jobs:
        description: "parallel attempts in sweep mode (2 fits the runner's memory)"
        default: "1"
      unattempted:
        description: "take the first N targets no sweep has touched yet"
        type: boolean
        default: false
      max_per_provider:
        description: "keep at most N lanes per provider (0 = all)"
        default: "8"
      max_calls:
        description: "hard stop"
        default: "300"

permissions:
  contents: write
  actions: write        # a finishing job dispatches the next one

concurrency:
  # a stage-2 relay dispatch runs beside the ladder instead of queuing hours behind it;
  # publish.py already retries a push on a fresh fetch when the other job lands first
  group: ${{ (github.event.schedule == '30 */2 * * *' || (inputs.relay_target != '' && inputs.relay_target != null) || (inputs.fixer_target != '' && inputs.fixer_target != null)) && 'relay' || 'attempt' }}
  cancel-in-progress: false

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          # Scheduled runs can wait hours; their event SHA predates newer ledgers.
          ref: main
          # No push token on disk while candidates run: publish adds it after the loop.
          persist-credentials: false

      - name: python deps
        run: python3 -m pip install -q requests

      - name: lean + mathlib cache + build
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: judge sandbox (untrusted Lean runs as another user)
        run: bash tools/judge_sandbox.sh

      - name: run the loop
        id: run
        env:
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          RELAY_TARGET: ${{ inputs.relay_target }}
          FIXER_TARGET: ${{ inputs.fixer_target }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = "30 */2 * * *" ]; then
            # stage 2 on its own: the fixer, then the relay, on the next open problem with tries left
            python3 tools/attempt.py --relay --relay-next --skip-benched --max-calls 15
          elif [ -n "$FIXER_TARGET" ]; then
            python3 tools/attempt.py --fixer --targets "targets/${FIXER_TARGET%/*}" --only "${FIXER_TARGET##*/}"
          elif [ -n "$RELAY_TARGET" ]; then
            # stage 2, the relay: the strongest live lanes try one open problem from its dossier
            python3 tools/attempt.py --relay --targets "targets/${RELAY_TARGET%/*}" --only "${RELAY_TARGET##*/}" \
              --skip-benched --max-calls "${{ inputs.max_calls }}"
          elif [ "$SCHEDULED" = "true" ] || [ "${{ inputs.ladder }}" = "true" ]; then
            # the ladder: every lane, every set, 3 tries per cell, until the wall-clock budget
            # every set: primer and mil statements + reference proofs kernel-checked by the targets workflow (2026-09-02)
            python3 tools/attempt.py --ladder --sets primer,mil,minif2f/test --attempts 3 --jobs 2 --max-minutes 320
          else
            python3 tools/attempt.py \
              --sample "${{ inputs.sample }}" --seed "${{ inputs.seed }}" \
              --order "${{ inputs.order }}" ${{ inputs.stop_on_accept && '--stop-on-accept' || '' }} \
              --lanes "${{ inputs.lanes }}" --attempts "${{ inputs.attempts }}" \
              --max-calls "${{ inputs.max_calls }}" --jobs "${{ inputs.jobs }}" \
              ${{ inputs.min_tier != '' && format('--min-tier {0}', inputs.min_tier) || '' }} \
              ${{ inputs.skip_benched && '--skip-benched' || '' }} \
              ${{ inputs.unattempted && '--unattempted' || '' }} \
              --max-per-provider "${{ inputs.max_per_provider }}"
          fi

      - name: snapshot this run's outputs
        if: always() && steps.run.outcome != 'skipped'
        run: python3 tools/publish.py --snapshot "$RUNNER_TEMP/sparebrains-recovery"

      - name: preserve outputs before publication
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sparebrains-recovery/
          retention-days: 30
          if-no-files-found: warn

      - name: publish the ledger
        id: publish
        if: always() && steps.run.outcome != 'skipped'
        env:
          RUN_ID: ${{ github.run_id }}
          CALLS: ${{ steps.run.outputs.calls }}
          ACCEPTS: ${{ steps.run.outputs.accepts }}
          MODE: ${{ steps.run.outputs.mode }}
          REMAINING: ${{ steps.run.outputs.remaining }}
          LANES: ${{ steps.run.outputs.lanes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "attempt run $RUN_ID: $CALLS calls, $ACCEPTS accepts, $MODE, $REMAINING cells left

          Generated-by: kumori free-LLM pool ($LANES lanes), cost \$0, via tools/attempt.py; verifier Lean v4.33.1 + mathlib v4.33.1 (tools/check.py)"

      - name: chain the next job
        if: success() && steps.publish.outcome == 'success' && steps.run.outputs.remaining != '' && steps.run.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run attempt.yml --ref main
