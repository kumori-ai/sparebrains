# The prover on Kaggle's free TPU v5e-8 (task #479): a speed check first, on SOLVED problems only, so no bar and no
# first solve is touched. Dispatch by hand: action=push builds and pushes a smoke batch; action=status reads the
# kernel's state and, once it is complete, its timing and answer counts. Nothing here runs Lean or writes the ledger.
name: prover-tpu

on:
  workflow_dispatch:
    inputs:
      action:
        description: "push a smoke batch, or read its status"
        type: choice
        options: [status, push]
        default: status
      n:
        description: "push: samples per solved problem"
        default: "4"

permissions:
  contents: read

concurrency:
  group: prover-tpu
  cancel-in-progress: false

jobs:
  tpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: python deps
        run: python3 -m pip install -q requests "kaggle>=1.8"
      - name: push a smoke batch
        if: inputs.action == 'push'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python3 tools/prover.py smoke-tpu --out "$RUNNER_TEMP/kernel" --n "${{ inputs.n }}"
          kaggle kernels push -p "$RUNNER_TEMP/kernel"
      - name: status and timing
        if: inputs.action == 'status'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels status kumoriai/sparebrains-prover-tpu 2>&1 | tail -1
          mkdir -p "$RUNNER_TEMP/kout"
          kaggle kernels output kumoriai/sparebrains-prover-tpu -p "$RUNNER_TEMP/kout" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/kout/timing.json" 2>/dev/null || echo "no timing yet"
          echo
          python3 - "$RUNNER_TEMP/kout/answers.jsonl" <<'EOF'
          import json, sys
          try:
              rows = [json.loads(l) for l in open(sys.argv[1])]
          except FileNotFoundError:
              sys.exit(print("no answers yet") or 0)
          toks = [r["tokens"] for r in rows]
          print(f"answers: {len(rows)} | tokens: {sum(toks)} | mean per answer: {sum(toks) // max(len(rows), 1)} | "
                f"finished by length: {sum(r['finish'] == 'length' for r in rows)}")
          EOF
          tail -20 "$RUNNER_TEMP/kout/"*.log 2>/dev/null || true
