# Decomposition (roadmap #8, DECISIONS.md 2026-10-19; tools/decompose.py): Leanstral writes each open one-step goal
# as smaller `have` steps; the loop's Lean-only pass takes them apart and closes what it can; each step still open
# goes one level down; a proved goal is spliced into its problem and judged by the kernel. Problems outside the
# stage-3 bar only, until it is graded. Dispatch by hand.
#
# The Mistral key is in the same step as Lean here, unlike leanstral.yml, because asking and checking alternate.
# Lean still runs as the sandbox user with a cleared environment (tools/check.py lean_cmd: sudo -u, env -i), which
# cannot read this job's processes (tools/judge_sandbox.sh), as attempt.yml's loop already does with its keys.
name: decompose

on:
  workflow_dispatch:
    inputs:
      max_goals:
        description: "goals to try, in the queue's order (real steps first), skipping any already tried"
        default: "40"
      lane:
        description: "a router lane (backend name) to ask instead of Leanstral; blank is Leanstral"
        default: ""

permissions:
  contents: write        # publish the ledger rows and verified proofs

concurrency:
  # Its own group, beside the Leanstral lane: a run pending in the cron'd `leanstral` group is cancelled by the next
  # cron (39507119927, 2026-10-20), and each caller paces itself and stops the round at Mistral's first 429.
  group: ${{ inputs.lane == '' && 'decompose' || format('decompose-{0}', inputs.lane) }}
  cancel-in-progress: false

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false        # no push token on disk while untrusted Lean runs

      - name: python deps
        run: python3 -m pip install -q requests

      - name: lean + mathlib cache + build
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: judge sandbox (untrusted Lean runs as another user)
        run: bash tools/judge_sandbox.sh

      - name: decompose
        env:
          SPAREBRAINS_LEANSTRAL_KEY: ${{ secrets.SPAREBRAINS_LEANSTRAL_KEY }}
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          python3 tools/decompose.py run --max-goals "${{ inputs.max_goals }}" $( [ -n "${{ inputs.lane }}" ] && echo --lane "${{ inputs.lane }}" ) \
            --out "ledger/decompose/run-${GITHUB_RUN_ID}.jsonl" | tee "$RUNNER_TEMP/out.txt"
          echo "SUMMARY=$(tail -1 "$RUNNER_TEMP/out.txt" | cut -c1-300)" >> "$GITHUB_ENV"

      - name: publish the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          MACHINE="$(nproc) vCPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo) GB RAM, $(lsb_release -ds 2>/dev/null || uname -sr)"
          python3 tools/publish.py --message "decompose run $GITHUB_RUN_ID: $SUMMARY

          Generated-by: ${{ inputs.lane && format('router lane {0} via Kumori', inputs.lane) || 'Leanstral 1.5 (labs-leanstral-1-5-1) on Mistral''s Labs API' }}, cost \$0, via tools/decompose.py; verifier Lean v4.33.1 + mathlib v4.33.1 (tools/check.py)
          Judged on: $MACHINE"
