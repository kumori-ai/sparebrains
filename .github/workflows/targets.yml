# Step 2 of PLAN.md §2: every target statement must type-check under this repo's
# mathlib pin with `sorry` as its only hole. A target that fails here is not a target.
# Sets that ship reference proofs (targets/<set>/reference/) must also have every
# reference ACCEPTED by the kernel: a rung nobody clears is then provably clearable.
name: targets

on:
  push:
    paths:
      - ".github/workflows/targets.yml"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "targets/**"
      - "tools/check.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targets
  cancel-in-progress: false

jobs:
  wellformed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: [minif2f/test, primer, mil]
    steps:
      - uses: actions/checkout@v7

      # One shared cache of Mathlib's packages, keyed on the toolchain and manifest, restored here and saved right after
      # the build, before any untrusted Lean runs. lean-action's own cache is keyed on the commit (2.4 GB per commit); on
      # 2026-11-05 four of them filled the repo's 10 GB and evicted every other cache, openproblems' data included.
      - name: mathlib packages (restore)
        id: lakecache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: lean + mathlib cache + build
        uses: ./.github/actions/lean-build

      - name: mathlib packages (save, before untrusted Lean)
        if: steps.lakecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages
          key: ${{ steps.lakecache.outputs.cache-primary-key }}

      - name: type-check ${{ matrix.set }}
        run: python3 tools/check.py --expect wellformed --jobs 2 targets/${{ matrix.set }}/*.lean

      - name: reference proofs of ${{ matrix.set }} accepted by the kernel
        if: hashFiles(format('targets/{0}/reference/*.lean', matrix.set)) != ''
        run: python3 tools/check.py --expect accept --jobs 2 targets/${{ matrix.set }}/reference/*.lean
