# The openproblems data outage (kumori #477; DECISIONS 2026-11-05 checkpoint): rebuild predict_modality's bmmc_cite
# training files from the public GEO deposit with upstream's own scripts, run the task's knnr_py on the site-1
# validation split, and compare its prediction digest with the one the ledger recorded on the S3 files. Same digest:
# the rebuild is the benchmark we measured on. No variant reproduces it: this reconstruction is not shown to be the
# same (library versions and the R step are not controlled), and any use of it is a separately versioned benchmark.
# By hand only; trusted code only (upstream's pinned scripts and ours), no model asked, nothing published: the
# receipt and the environment's pip freeze are the artifact.
name: openproblems-rebuild

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Compare pre-refactor and restored import order on this same runner"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openproblems-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: python env (the reference's pinned numerical libraries, plus upstream's for the dataset steps)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -c tools/sandbox/requirements.txt -c tools/sandbox/dataset-constraints.txt numpy scipy scikit-learn anndata pyyaml requests scanpy muon zarr
          "$RUNNER_TEMP/venv/bin/pip" freeze > "$RUNNER_TEMP/pip-freeze.txt"

      - name: rebuild from GEO and compare the reference's digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          df -h "$RUNNER_TEMP" | tail -1; free -g | sed -n 2p
          "$RUNNER_TEMP/venv/bin/python" tools/openproblems_rebuild.py --work "$RUNNER_TEMP/rebuild" \
            --expect-from ledger/openproblems/evolve-41869521760.jsonl --out "$RUNNER_TEMP/rebuild-receipt.json"
          cat "$RUNNER_TEMP/rebuild-receipt.json"

      - name: compare code and import order on the same machine
        if: inputs.diagnose
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          mkdir -p _oneoff
          scratch=$(mktemp -d "$PWD/_oneoff/rebuild-compare.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          lscpu > "$RUNNER_TEMP/rebuild-machine.txt"
          gh api 'repos/kumori-ai/sparebrains/contents/tools/openproblems_rebuild.py?ref=8626fe5b' \
            --jq .content | base64 --decode > "$scratch/before.py"
          "$RUNNER_TEMP/venv/bin/python" "$scratch/before.py" --work "$scratch/before" \
            --expect-from ledger/openproblems/evolve-41869521760.jsonl --out "$RUNNER_TEMP/rebuild-before.json"
          "$RUNNER_TEMP/venv/bin/python" -c 'import openproblems_rebuild as rb; import anndata; raise SystemExit(rb.main())' \
            --work "$scratch/import-order" --expect-from ledger/openproblems/evolve-41869521760.jsonl \
            --out "$RUNNER_TEMP/rebuild-import-order.json"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ("receipt", "before", "import-order"):
              result = json.loads((root / f"rebuild-{name}.json").read_text())
              print(name, {k: v["pred_fp"] for k, v in result["variants"].items()}, flush=True)
          PY

      - name: keep the receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openproblems-rebuild-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rebuild-receipt.json
            ${{ runner.temp }}/rebuild-before.json
            ${{ runner.temp }}/rebuild-import-order.json
            ${{ runner.temp }}/rebuild-machine.txt
            ${{ runner.temp }}/pip-freeze.txt
          retention-days: 90
          if-no-files-found: warn
