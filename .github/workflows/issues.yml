# Stage 2's public threads (DECISIONS.md 2026-10-06), posted as kumori-ai[bot]. After every attempt
# run: a digest on each problem a relay run touched, the first post refreshed, and every comment
# copied into the problem's dossier so the next model reads it. By hand: open or refresh threads.
# Comments are only ever read as text here; nothing from an issue is executed.
name: issues

on:
  workflow_run:
    workflows: [attempt]
    types: [completed]
  workflow_dispatch:
    inputs:
      post:
        description: "<set>/<target> keys to open or refresh, comma-separated"
        default: ""
      note_issue:
        description: "issue number for a status note from the maintainer, posted as the bot"
        default: ""
      note_body:
        description: "the note's text (markdown)"
        default: ""
      note_close:
        description: "close that issue as completed after the note"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main                      # the attempt run's ledger commit has landed by now
          persist-credentials: false

      - name: kumori-ai[bot] token (one hour, issues on this repo only)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPAREBRAINS_APP_ID }}
          private-key: ${{ secrets.SPAREBRAINS_APP_KEY }}

      - name: threads
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
          POST: ${{ inputs.post }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          NOTE_ISSUE: ${{ inputs.note_issue }}
          NOTE_BODY: ${{ inputs.note_body }}
          NOTE_CLOSE: ${{ inputs.note_close }}
        run: |
          if [ -n "$NOTE_ISSUE" ]; then
            case "$NOTE_ISSUE" in *[!0-9]*) echo "note_issue must be a number"; exit 1;; esac
            python3 tools/problem_issues.py --note "$NOTE_ISSUE" $( [ "$NOTE_CLOSE" = "true" ] && echo --close )
            exit 0
          fi
          python3 -m pip install -q requests
          if [ -n "$POST" ]; then python3 tools/problem_issues.py --post --only "$POST"; fi
          if [ -n "$RUN_ID" ]; then python3 tools/problem_issues.py --digest "$RUN_ID"; fi
          python3 tools/problem_issues.py --refill 5
          python3 tools/problem_issues.py --sync
