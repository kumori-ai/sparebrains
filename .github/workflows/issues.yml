# The public threads (DECISIONS.md 2026-10-06, 2026-10-17), posted as kumori-ai[bot]. Every hour and after
# attempt runs: a thread for every open problem (25 new a run at most), every judged try not yet reported
# posted on its thread (any mode; GitHub drops most workflow_run events for self-chained runs), the daily
# log once a UTC day, and every comment copied into the problem's dossier so the next model reads it.
# Comments are only ever read as text here; nothing from an issue is executed.
name: issues

on:
  workflow_run:
    workflows: [attempt]
    types: [completed]
  schedule:
    - cron: "23 * * * *"      # the heartbeat: workflow_run fired for 22 of 60 attempt runs, 2026-10-16..17
  workflow_dispatch:
    inputs:
      open_title:
        description: "open a new issue as the bot: its title (a gate or plan issue)"
        default: ""
      open_body:
        description: "the new issue's body (markdown)"
        default: ""
      open_labels:
        description: "the new issue's labels, comma-separated"
        default: ""
      post:
        description: "<set>/<target> keys to open or refresh, comma-separated"
        default: ""
      note_issue:
        description: "issue number for a status note from the maintainer, posted as the bot"
        default: ""
      note_body:
        description: "the note's text (markdown)"
        default: ""
      daily_redo:
        description: "rewrite today's daily log comment in place (marked corrected)"
        type: boolean
        default: false
      note_close:
        description: "close that issue as completed after the note"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main                      # the attempt run's ledger commit has landed by now
          persist-credentials: false

      - name: kumori-ai[bot] token (one hour, issues on this repo only)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPAREBRAINS_APP_ID }}
          private-key: ${{ secrets.SPAREBRAINS_APP_KEY }}

      - name: threads
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
          POST: ${{ inputs.post }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          NOTE_ISSUE: ${{ inputs.note_issue }}
          NOTE_BODY: ${{ inputs.note_body }}
          NOTE_CLOSE: ${{ inputs.note_close }}
          OPEN_TITLE: ${{ inputs.open_title }}
          OPEN_BODY: ${{ inputs.open_body }}
          OPEN_LABELS: ${{ inputs.open_labels }}
          DAILY_REDO: ${{ inputs.daily_redo }}
        run: |
          if [ -n "$OPEN_TITLE" ]; then
            python3 tools/problem_issues.py --open
            exit 0
          fi
          if [ -n "$NOTE_ISSUE" ]; then
            case "$NOTE_ISSUE" in *[!0-9]*) echo "note_issue must be a number"; exit 1;; esac
            python3 tools/problem_issues.py --note "$NOTE_ISSUE" $( [ "$NOTE_CLOSE" = "true" ] && echo --close )
            exit 0
          fi
          python3 -m pip install -q requests
          if [ -n "$POST" ]; then python3 tools/problem_issues.py --post --only "$POST"; fi
          python3 tools/problem_issues.py --refill 1000 --max-new 25
          python3 tools/problem_issues.py --catchup
          python3 tools/problem_issues.py --daily $( [ "$DAILY_REDO" = "true" ] && echo --redo )
          python3 tools/problem_issues.py --sync
