# openproblems.bio predict_modality (task #477, roadmap row 11; the bar in DECISIONS.md 2026-10-20): a free model
# writes predict(), and each candidate runs as a separate user on the site-1 validation split only. The test set is
# never scored here. By hand, and once a day (2026-10-28): 12 Leanstral asks seeded from every evolve row so far, at a
# quiet hour for the shared free key, because the rung sat idle 6 days with nothing dispatching it (its last run
# 2026-10-22 19:17 UTC) while the ladder ran 400 jobs; the daily report (ledger/daily/) shows each day's rounds.
name: openproblems

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "asks to the writer model"
        default: "12"
      lane:
        description: "leanstral (Mistral's Labs API), or a Kumori router lane"
        default: "leanstral"
      max_asks:
        description: "stop at this many writer asks, repairs included; both A/B arms get the same (24 = 12 rounds with up to 2 repairs each, the cap the cron uses)"
        default: "24"
      seed_upto:
        description: "seed only from evolve rows stamped before this UTC time (an A/B's arms share it); empty = all"
        default: ""
      parents:
        description: "single (the best so far is the parent) or archive (a draw from distinct elites, #598); empty = the cron's A/B, by UTC day parity"
        default: ""
      repairs:
        description: "repair asks a round after a small-slice crash (2, the cron's); -1 turns the screen off (an experiment's tools-off arm)"
        default: "2"
      experiment:
        description: "a C2 experiment label (DECISIONS 2026-11-03): rows under ledger/openproblems/experiments/, qualify feedback off; needs seed_from, seed_upto, parents and ref"
        default: ""
      seed_from:
        description: "experiment: the frozen seed row, ledger/openproblems/evolve-RUN.jsonl:ROUND (both arms the same)"
        default: ""
      ref:
        description: "experiment: the evaluator commit (full 40-hex SHA), both arms and their outcomes the same"
        default: ""
      pair:
        description: "a registered arm (C2 R5) as PAIR/ARM/ATTEMPT, e.g. p3/on/1; needs experiment and ref, and takes every other setting from the experiment's manifest"
        default: ""

permissions:
  contents: write        # publish the ledger rows

# Its own group: one ask every few minutes is far under Mistral's 38 a minute, every Leanstral caller stops at the
# first 429, and a run pending in the cron'd `leanstral` group is cancelled by the next cron (decompose 39507119927).
# An experiment arm has its own group (C4): router-spending arms run one at a time, and never take the cron's pending slot.
concurrency:
  group: openproblems${{ (inputs.experiment != '' || inputs.pair != '') && '-exp' || '' }}
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: an experiment's inputs are complete
        if: inputs.experiment != '' || inputs.pair != ''
        run: |
          [[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::experiment needs ref, a full commit SHA"; exit 1; }
          [ -n "${{ inputs.experiment }}" ] || { echo "::error::a pair needs its experiment"; exit 1; }
          if [ -n "${{ inputs.pair }}" ]; then
            [[ "${{ inputs.pair }}" =~ ^p[0-9]+/(on|off)/[12]$ ]] || { echo "::error::pair is PAIR/ARM/ATTEMPT, e.g. p3/on/1"; exit 1; }
          else
            [ -n "${{ inputs.seed_from }}" ] && [ -n "${{ inputs.seed_upto }}" ] && [ -n "${{ inputs.parents }}" ] \
              || { echo "::error::experiment needs seed_from, seed_upto and parents"; exit 1; }
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.experiment != '' && inputs.ref || 'main' }}
          persist-credentials: false        # no push token on disk while untrusted code runs

      # An experiment's code is pinned; its ledger inputs (the frozen seed row) come from main (Codex 20261103T233724672486Z f4).
      # Inside the workspace: actions/checkout refuses a path outside it (Codex 20261103T233831238305Z).
      - uses: actions/checkout@v7
        if: inputs.experiment != ''
        with:
          ref: main
          path: .ledger-main
          persist-credentials: false

      - name: python env (readable by the sandbox user)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -c tools/sandbox/requirements.txt numpy scipy scikit-learn anndata pyyaml requests   # numerical libs pinned with the candidate image (the host runs the reference)
          chmod -R o+rX "$RUNNER_TEMP/venv"

      - name: the task's data
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/op/data
            ${{ runner.temp }}/op/data-swap
          key: openproblems-predict-modality-bmmc-cite-normal-swap-log-cp10k-2026-09-30

      # Trusted code only: the task's own knnr_py script scores the reference on the validation split.
      - name: validation split and the reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py prepare --work "$RUNNER_TEMP/op"

      # Upstream main against the pin (tools/openproblems.py UPSTREAM_SHA, 2026-11-03): when main has moved, the
      # reproduce gate runs there once per upstream commit and drift-<sha12>.json says whether the pin can move.
      # A warning, never a failed run: the run itself reads only the pin.
      - name: upstream drift
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py drift --work "$RUNNER_TEMP/op" --out ledger/openproblems

      # Each candidate runs in its own gVisor container: no network, read-only root, only its direction's inputs
      # mounted read-only, its prediction streamed back (tools/openproblems.py docker_cmd, DECISIONS 2026-10-22).
      # The check proves runsc, the network block and the stream before any round is spent.
      - name: candidate sandbox
        run: |
          chmod 700 "$RUNNER_TEMP/op/answers" "$RUNNER_TEMP/op/data" "$RUNNER_TEMP/op/answers-swap" "$RUNNER_TEMP/op/data-swap"
          PY="$RUNNER_TEMP/venv/bin/python" bash tools/sandbox/check.sh

      # C2 R5: the gate reads main's manifest and dispatch records, and this arm's record goes to main before any ask,
      # so a run that dies without publishing still counts as an incomplete arm, and no arm runs twice or out of order.
      # It runs after data, sandbox and the lane's daily room are proven, so a setup failure never spends a pair's rerun.
      - name: register this arm (C2 R5)
        id: gate
        if: inputs.pair != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          IFS=/ read -r pair arm attempt <<< "${{ inputs.pair }}"
          exp="${{ inputs.experiment }}"
          man=".ledger-main/ledger/openproblems/experiments/$exp/manifest.json"
          "$RUNNER_TEMP/venv/bin/python" -I tools/lane_budget.py --need "$(jq -r .max_asks "$man")" --lane "$(jq -r .lane "$man")"
          got=$(python3 -I tools/openproblems_registry.py gate --registry ".ledger-main/ledger/openproblems/experiments/$exp" \
            --pair "$pair" --arm "$arm" --attempt "$attempt" --run-id "$GITHUB_RUN_ID" \
            --write "ledger/openproblems/experiments/$exp/dispatches.jsonl")
          echo "$got"
          echo "ledger_commit=$(jq -r .ledger_commit <<< "$got")" >> "$GITHUB_OUTPUT"
          echo "LANE=$(jq -r .lane <<< "$got")" >> "$GITHUB_ENV"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "openproblems $exp: $pair $arm attempt $attempt dispatched as run $GITHUB_RUN_ID (C2 R5), before any ask"
          git config --unset http.https://github.com/.extraheader

      # Fresh main (the record just pushed) for the ownership check, and the manifest's frozen ledger for every input.
      - uses: actions/checkout@v7
        if: inputs.pair != ''
        with:
          ref: main
          path: .ledger-main
          persist-credentials: false

      - uses: actions/checkout@v7
        if: inputs.pair != ''
        with:
          ref: ${{ steps.gate.outputs.ledger_commit }}
          path: .ledger-frozen
          persist-credentials: false

      - name: evolve
        env:
          SPAREBRAINS_LEANSTRAL_KEY: ${{ secrets.SPAREBRAINS_LEANSTRAL_KEY }}
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          set -o pipefail      # the `| tee` below hid a refused arm's exit (41745355874 went green, 2026-11-04)
          # The arm (#598, 2026-11-01): by hand as given; the daily cron alternates by UTC day of year, odd = single,
          # even = archive, so each arm gets the same asks on alternate days and the ledger row says which it was.
          parents="${{ inputs.parents }}"; seed_upto="${{ inputs.seed_upto }}"
          if [ -z "$parents" ]; then
            # A pair is an odd day (single) and the even day after it (archive); both seed from the rows published
            # before the pair's first run (09:00 UTC of the odd day), so the arms start equal and the cutoff still
            # advances with every pair (Codex 20261101T2xxx f3). A by-hand run passes its own seed_upto or none.
            if [ $(( $(date -u +%-j) % 2 )) -eq 0 ]; then parents=archive; pair_day=$(date -u -d yesterday +%F); else parents=single; pair_day=$(date -u +%F); fi
            [ -z "$seed_upto" ] && seed_upto="${pair_day}T09:00:00+00:00"
          fi
          echo "arm: $parents; seed_upto: ${seed_upto:-all}"
          out="ledger/openproblems/evolve-${GITHUB_RUN_ID}.jsonl"; exp=()
          if [ -n "${{ inputs.experiment }}" ]; then
            out="ledger/openproblems/experiments/evolve-${GITHUB_RUN_ID}.jsonl"
            exp=(--experiment "${{ inputs.experiment }}" --seed-from "${{ inputs.seed_from }}" --ledger-root .ledger-main/ledger)
          fi
          if [ -n "${{ inputs.pair }}" ]; then     # every setting from the manifest; the flags above are overridden
            IFS=/ read -r pair arm attempt <<< "${{ inputs.pair }}"
            exp=(--pair "$pair" --arm "$arm" --attempt "$attempt" --run-id "$GITHUB_RUN_ID" --ledger-root .ledger-frozen/ledger
                 --registry ".ledger-main/ledger/openproblems/experiments/${{ inputs.experiment }}")
          fi
          echo "OUT=$out" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py evolve --work "$RUNNER_TEMP/op" --rounds "${{ inputs.rounds || 12 }}" \
            --lane "${{ inputs.lane || 'leanstral' }}" --max-asks "${{ inputs.max_asks || 24 }}" --seed-upto "$seed_upto" \
            --parents "$parents" --repairs "${{ inputs.repairs || 2 }}" --out "$out" "${exp[@]}" | tee "$RUNNER_TEMP/out.txt"
          echo "SUMMARY=$(tail -1 "$RUNNER_TEMP/out.txt" | cut -c1-300)" >> "$GITHUB_ENV"

      - name: publish the ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "${OUT:-ledger/openproblems/evolve-${GITHUB_RUN_ID}.jsonl}" ] || [ -n "$(git ls-files --others -- 'ledger/openproblems/drift-*.json')" ] || exit 0
          [ -n "$SUMMARY" ] || SUMMARY="no evolve rows; upstream drift receipt only"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          MACHINE="$(nproc) vCPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo) GB RAM, $(lsb_release -ds 2>/dev/null || uname -sr)"
          GEN="${{ (inputs.lane || 'leanstral') == 'leanstral' && 'Leanstral 1.5 (labs-leanstral-1-5-1) on Mistral''s Labs API' || format('router lane {0} via Kumori', inputs.lane) }}"
          [ -n "$LANE" ] && GEN="router lane $LANE via Kumori"
          python3 tools/publish.py --message "openproblems evolve $GITHUB_RUN_ID${{ inputs.pair != '' && format(' ({0} {1})', inputs.experiment, inputs.pair) || '' }}: $SUMMARY

          Generated-by: $GEN, cost \$0, via tools/openproblems.py; scored on the site-1 validation split only
          Run on: $MACHINE"
