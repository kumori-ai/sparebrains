# One openproblems.bio candidate on the test set (roadmap row 11; the bar in DECISIONS.md 2026-10-20): both
# directions of bmmc_cite, the task's own metric scripts (R in its own image), a paired bootstrap against knnr_py,
# and the bar's verdict. At most 3 candidates ever (tools/openproblems.py refuses a 4th); every result is published.
# No secrets: the candidate runs as the sandbox user and cannot read the answers. Dispatch by hand.
name: openproblems-final

on:
  workflow_dispatch:
    inputs:
      evolve_file:
        description: "ledger/openproblems/evolve-RUN.jsonl holding the candidate"
        default: ""
      round:
        description: "the candidate's round in that file"
        default: ""
      smoke:
        description: "a fixed ridge candidate to prove the pipeline: not one of the 3 test scorings, not published"
        type: boolean
        default: false

permissions:
  contents: write        # publish the result

concurrency:
  group: openproblems-final
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false        # no push token on disk while untrusted code runs

      - name: python env (readable by the sandbox user)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -c tools/sandbox/requirements.txt numpy scipy scikit-learn anndata pyyaml requests   # numerical libs pinned with the candidate image (the host runs the reference)
          chmod -R o+rX "$RUNNER_TEMP/venv"

      # The sandbox is proven before the shot is reserved, so a broken image or runtime spends no shot.
      - name: candidate sandbox
        run: PY="$RUNNER_TEMP/venv/bin/python" bash tools/sandbox/check.sh

      # The shot is taken and published before any test data is read, so a run lost mid-scoring still counts
      # (2026-10-22). The push token is written for this step only and removed before untrusted code exists.
      - name: reserve the shot
        if: ${{ !inputs.smoke }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # removed on any exit; the step fails if the header is still there afterwards
          trap 'git config --unset-all http.https://github.com/.extraheader; if git config --get-all http.https://github.com/.extraheader; then echo "push token still in .git/config" >&2; exit 1; fi' EXIT
          "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py reserve --evolve-file "${{ inputs.evolve_file }}" \
            --round "${{ inputs.round }}" --out "ledger/openproblems/final-${GITHUB_RUN_ID}.json" | tee "$RUNNER_TEMP/reserve.txt"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "openproblems shot reserved ${GITHUB_RUN_ID}: ${{ inputs.evolve_file }} round ${{ inputs.round }}: $(tail -1 "$RUNNER_TEMP/reserve.txt")"

      - name: score on the test set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            set +e
            "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py final --work "$RUNNER_TEMP/op" --smoke \
              --out "$RUNNER_TEMP/final-smoke.json" | tee "$RUNNER_TEMP/out.txt"
            status=${PIPESTATUS[0]}
            cat "$RUNNER_TEMP/final-smoke.json" 2>/dev/null   # the smoke's evidence in the run log, pass or fail
            exit "$status"
          fi
          out="ledger/openproblems/final-${GITHUB_RUN_ID}.json"
          "$RUNNER_TEMP/venv/bin/python" -I tools/openproblems.py final --work "$RUNNER_TEMP/op" \
            --evolve-file "${{ inputs.evolve_file }}" --round "${{ inputs.round }}" --out "$out" | tee "$RUNNER_TEMP/out.txt"
          echo "SUMMARY=$(tail -1 "$RUNNER_TEMP/out.txt" | cut -c1-300)" >> "$GITHUB_ENV"

      - name: publish the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "ledger/openproblems/final-${GITHUB_RUN_ID}.json" ] || exit 0
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "openproblems final ${GITHUB_RUN_ID}: ${{ inputs.evolve_file }} round ${{ inputs.round }}: $SUMMARY

          Scored with the task's own mse and R correlation scripts (openproblems/base_r:1); candidate run as the sandbox user, cost \$0"
