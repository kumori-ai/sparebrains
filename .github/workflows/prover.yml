# Stage 3, the prover lane (DECISIONS.md 2026-10-17). Kaggle's free GPUs write the answers (tools/prover_kernel.py);
# this job keeps one Kaggle batch going at a time and judges each finished batch here, with tools/check.py as the
# sandbox user, like every other try. Every two hours: if the batch is still running, nothing happens; if it is done,
# its answers are judged (resumable: a job that runs out of time leaves the rest for the next); when every answer is
# judged, the next batch is pushed, until the bar's problems each have their 32 samples.
# Two legs, one after the other: the T4 x2 on the bar's problems (and plan and goal batches), and the TPU v5e-8 on
# its own weekly hours on every other open problem (task #479; prover.py next --tpu): the 8B on schedule, the 32B
# (task #534) only by hand, dispatched with tpu32 (2026-10-24: both 32B batches died in loading at ~80 min).
name: prover

on:
  schedule:
    - cron: "45 */2 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "push the next batch now, whatever the last one did (after reading its log)"
        type: boolean
        default: false
      tpu32:
        description: "with push: the TPU leg pushes the 32B on the reachable problems instead of the 8B"
        type: boolean
        default: false
      smoke:
        description: "with push: a TPU-only smoke batch of this many problems (startup check); the GPU leg pushes nothing"
        default: ""

permissions:
  contents: write        # publish the ledger rows and verified proofs

concurrency:
  group: prover
  cancel-in-progress: false

jobs:
  prover:
    name: prover (${{ matrix.accel }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 1          # one ledger writer at a time
      fail-fast: false         # a failed TPU batch never stops the GPU leg, nor the other way round
      matrix:
        include:
          - accel: gpu
            kernel: kumoriai/sparebrains-prover
            flag: ""
            hw: "GPU T4 x2"
          - accel: tpu
            kernel: kumoriai/sparebrains-prover-tpu
            flag: "--tpu"
            hw: "TPU v5e-8"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false        # no push token on disk while untrusted Lean runs

      - name: python deps
        run: python3 -m pip install -q requests "kaggle>=2.2.4"   # 2.2.4 adds `kaggle quota`, which sizes each batch

      # The one-time alert, proved on every run (2026-10-24): a synthetic failed batch through the same command the
      # step below runs must say new (exit 3) the first time and known (0) the second. Its own ledger file; nothing is published.
      - name: canary, a synthetic failed batch alerts once
        if: matrix.accel == 'gpu'
        run: |
          c="$RUNNER_TEMP/canary"; mkdir -p "$c/kpull" "$c/kout"
          echo 'BATCH = "canary-20261024T0000"' > "$c/kpull/k.py"
          for n in 1 2; do
            GITHUB_OUTPUT=/dev/null python3 tools/prover.py failed --dir "$c/kpull" --out "$c/kout" \
              --status "KernelWorkerStatus.ERROR" --ledger "$c/failed.jsonl" >/dev/null && rc=0 || rc=$?   # steps run bash -e
            eval "rc$n=$rc"
          done
          echo "canary: first sight exit $rc1, second $rc2 (3 then 0 is right)"
          [ "$rc1" = 3 ] && [ "$rc2" = 0 ]

      # The Kaggle token lives only in this step and the push step; neither runs Lean.
      - name: the Kaggle batch
        id: kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A TPU batch's heartbeats (2026-10-23), read before its status so a batch that ended in ERROR still leaves
          # them: its pulled source names its ntfy topic, which keeps messages 12 h, and this job runs every 2 h.
          if [ "${{ matrix.accel }}" = "tpu" ]; then
            kaggle kernels pull ${{ matrix.kernel }} -p "$RUNNER_TEMP/kpull" >/dev/null 2>&1 || true
            python3 tools/prover.py beats --dir "$RUNNER_TEMP/kpull" || true
          fi
          if [ "${{ inputs.push }}" = "true" ] && [ "${{ matrix.accel }}" = "gpu" ] && [ -z "${{ inputs.smoke }}" ]; then echo "state=push" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The command's own exit code too: an error message from a failed call is not a batch's status (Codex
          # 20261024T135544122224Z: "ERROR: transient service unavailable" read as a failed batch).
          out=$(kaggle kernels status ${{ matrix.kernel }} 2>&1) && status_rc=0 || status_rc=$?
          status=$(printf '%s\n' "$out" | tail -1)
          echo "kaggle: $status"
          echo "status=$(printf '%s' "$status" | tr -d '\r' | cut -c1-200)" >> "$GITHUB_OUTPUT"
          # A TPU batch waits in one queue slot per user: a hand push goes only when no batch holds it.
          if [ "${{ inputs.push }}" = "true" ] && [ "${{ matrix.accel }}" = "tpu" ]; then
            case "$status_rc:$status" in
              0:*RUNNING*|0:*QUEUED*) echo "a TPU batch holds the queue slot ($status); nothing pushed"; echo "state=running" >> "$GITHUB_OUTPUT" ;;
              0:*) echo "state=push" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::kaggle kernels status exited $status_rc: $status; nothing pushed"; exit 1 ;;
            esac
            exit 0
          fi
          case "$status" in
            *RUNNING*|*QUEUED*) echo "state=running" >> "$GITHUB_OUTPUT"; exit 0 ;;
            # A kernel that was never pushed reads as "Cannot access kernel ... (Permission 'kernels.get' was denied)",
            # not a 404 (first run, 2026-10-17). A bad token would still fail loudly at the push.
            *404*|*"Not Found"*|*"not found"*|*"Cannot access kernel"*) echo "no batch yet"; echo "state=push" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *COMPLETE*) ;;
            # A failed or cancelled batch is never pushed again on its own: that would spend the week's GPU
            # hours on the same failure every two hours. A person reads its log and dispatches by hand.
            # It alerts once (2026-10-24; 5 failed runs in 2 days on one batch): the first job to see it records it in
            # ledger/prover-beats/failed.jsonl with the tail of whatever log Kaggle kept and fails; later jobs pass
            # with a notice. Its source names the batch, so the GPU leg pulls it here too. Only Kaggle's terminal
            # statuses: anything else (a reset connection, a changed message) fails this run alone and is never recorded.
            *'status "KernelWorkerStatus.ERROR"'*|*'status "KernelWorkerStatus.CANCEL'*)
              [ "$status_rc" = 0 ] || { echo "::error::kaggle kernels status exited $status_rc: $status; nothing recorded, the next run reads it again"; exit 1; }
              [ -d "$RUNNER_TEMP/kpull" ] || kaggle kernels pull ${{ matrix.kernel }} -p "$RUNNER_TEMP/kpull" >/dev/null 2>&1 || true
              mkdir -p "$RUNNER_TEMP/kout"
              kaggle kernels output ${{ matrix.kernel }} -p "$RUNNER_TEMP/kout" >/dev/null 2>&1 && fetched="" || fetched="--log-fetch-failed"
              echo "state=failed" >> "$GITHUB_OUTPUT"
              # 3 = first sight: the last step fails the run then, after the record is published; 0 = known;
              # 2 = no batch id or no download: nothing recorded, this run fails and the next one retries;
              # anything else (1 = an exception) fails the step at once
              python3 tools/prover.py failed --dir "$RUNNER_TEMP/kpull" --out "$RUNNER_TEMP/kout" --status "$status" $fetched && rc=0 || rc=$?
              [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
              # A failed 32B is followed by ONE scheduled 8B (2026-10-24), new or known: the record must be on main
              # (publish step) and the push step reserves the replacement in the same ledger, published and confirmed,
              # before it pushes. A batch that already has its reservation is never replaced again, whatever Kaggle
              # reads back (Codex 20261024T142004542959Z: read-after-push is undocumented).
              fb=$(sed -n 's/^failed_batch=//p' "$GITHUB_OUTPUT" | tail -1)
              case "${{ matrix.accel }}:$status:$fb" in
                tpu:*'status "KernelWorkerStatus.ERROR"'*:tpu32-*)
                  [ "$(python3 tools/prover.py reserved --batch "$fb")" = 0 ] && echo "replace=1" >> "$GITHUB_OUTPUT" \
                    || echo "::notice::$fb already had its one 8B replacement; a person dispatches the next" ;;
              esac
              exit 0 ;;
            *) echo "::error::Kaggle status not understood: $status; nothing recorded, the next run reads it again"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/kout"
          kaggle kernels output ${{ matrix.kernel }} -p "$RUNNER_TEMP/kout" >/dev/null 2>&1 || true
          tail -5 "$RUNNER_TEMP/kout/"*.log 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/kout/answers.jsonl" ]; then
            echo "::error::the batch completed with no answers; read its log on Kaggle before pushing again"; exit 1
          fi
          pending=$(python3 tools/prover.py pending --answers "$RUNNER_TEMP/kout/answers.jsonl")
          echo "answers still to judge: $pending"
          if [ "$pending" != "0" ]; then echo "state=judge" >> "$GITHUB_OUTPUT"; else echo "state=push" >> "$GITHUB_OUTPUT"; fi

      # Published here, before any Lean runs, and the push header is removed in the same step.
      # A failed batch's record (ledger/prover-beats/failed.jsonl) goes out here too, from either leg.
      - name: publish the heartbeats
        id: beats
        if: always() && (matrix.accel == 'tpu' || steps.kaggle.outputs.state == 'failed')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "prover ${{ matrix.accel }} heartbeats${{ steps.kaggle.outputs.failure == 'new' && format(' and failed batch {0}', steps.kaggle.outputs.failed_batch) || '' }}: $(ls -t ledger/prover-beats 2>/dev/null | head -1)

          Generated-by: no model; the TPU kernel's own heartbeats via ntfy.sh (tools/prover.py beats) and Kaggle's status and log for a failed batch (tools/prover.py failed), cost \$0" || true
          # The 8B replacement waits for the failure's record to be on main, so no later job can see it as new.
          if [ "${{ steps.kaggle.outputs.replace }}" = "1" ]; then
            b="${{ steps.kaggle.outputs.failed_batch }}"
            n=$(git fetch -q origin main && git show origin/main:ledger/prover-beats/failed.jsonl | grep -cF "\"batch\": \"$b\"" || true)
            [ "${n:-0}" -gt 0 ] && echo "published=1" >> "$GITHUB_OUTPUT" || echo "::warning::the record of $b is not on main yet; no 8B replacement this run"
          fi
          # Fails the step if the header outlives it, so no later step, Lean included, runs with it.
          git config --unset-all http.https://github.com/.extraheader
          ! git config --get-regexp '^http\..*extraheader'

      - name: lean + mathlib cache + build
        if: steps.kaggle.outputs.state == 'judge'
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: judge sandbox (untrusted Lean runs as another user)
        if: steps.kaggle.outputs.state == 'judge'
        run: bash tools/judge_sandbox.sh

      - name: judge the answers
        id: judge
        if: steps.kaggle.outputs.state == 'judge'
        env:
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          python3 tools/prover.py judge --answers "$RUNNER_TEMP/kout/answers.jsonl" --max-minutes 270 | tee "$RUNNER_TEMP/judge.txt"
          echo "summary=$(tail -1 "$RUNNER_TEMP/judge.txt")" >> "$GITHUB_OUTPUT"

      # Queue and run times, once per batch (DECISIONS.md 2026-10-17): Kaggle publishes no wait times, so we
      # keep our own in ledger/prover-batches.jsonl.
      - name: record the batch's timing
        if: always() && steps.judge.outcome == 'success'
        run: python3 tools/prover.py batch-record --answers "$RUNNER_TEMP/kout/answers.jsonl" --dir "$RUNNER_TEMP/kout"

      - name: publish the ledger
        if: always() && steps.judge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.judge.outputs.summary }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          # The runner this job got (GitHub promises 4 vCPU and 16 GB on public repos, not the CPU model): one line in the commit.
          MACHINE="$(nproc) vCPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo) GB RAM, $(lsb_release -ds 2>/dev/null || uname -sr)"
          python3 tools/publish.py --message "prover batch judged: $SUMMARY

          Generated-by: the model named in the summary above (Goedel-Prover-V2-8B, or -32B for tpu32- batches) on Kaggle (${{ matrix.hw }}), cost \$0, via tools/prover_kernel${{ matrix.accel == 'tpu' && '_tpu' || '' }}.py; verifier Lean v4.33.1 + mathlib v4.33.1 (tools/check.py)
          Judged on: $MACHINE"

      - name: push the next batch
        id: push
        # a smoke dispatch is TPU-only: the GPU leg pushes nothing, whatever its own status says
        if: (steps.kaggle.outputs.state == 'push' || (steps.kaggle.outputs.replace == '1' && steps.beats.outputs.published == '1')) && !(matrix.accel == 'gpu' && inputs.smoke != '')
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Goal batches (task #461) only when the repository variable PROVER_MODE is "goals": set after the
          # stage-3 bar is graded, so nothing changes the prover's inputs while it is measured.
          # The week's GPU hours used exactly (2026-10-19): the session is sized to what Kaggle says is left this
          # week, and the kernel starts a chunk only if it still fits. Under an hour left: wait for Saturday's reset.
          # The 32B only on a hand push (push and tpu32 both set), never as the replacement (Codex 20261024T141626925446Z).
          [ "${{ steps.kaggle.outputs.replace }}" = "1" ] && echo "after the failed 32B batch ${{ steps.kaggle.outputs.failed_batch }}: the 8B"
          hours=$(python3 tools/prover.py hours ${{ matrix.flag }})
          if [ "$hours" = "0.0" ]; then echo "no ${{ matrix.accel }} batch this run: the 'holding:' line above says what holds it"; exit 0; fi
          batch=$(python3 tools/prover.py next ${{ matrix.flag }} ${{ matrix.accel == 'tpu' && inputs.push && inputs.tpu32 && steps.kaggle.outputs.replace != '1' && '--tpu32' || '' }} ${{ matrix.accel == 'tpu' && inputs.push && inputs.smoke != '' && steps.kaggle.outputs.replace != '1' && format('--smoke --max-problems {0}', inputs.smoke) || '' }} --out "$RUNNER_TEMP/kernel" --hours "$hours" $( [ "${{ matrix.accel }}" = "gpu" ] && [ "${{ vars.PROVER_MODE }}" = "goals" ] && echo --goals ))
          if [ -z "$batch" ]; then echo "every problem has its samples; nothing to push"; exit 0; fi
          # The replacement's reservation, on main before the push (2026-10-24). No Lean runs in this step.
          if [ "${{ steps.kaggle.outputs.replace }}" = "1" ]; then
            b="${{ steps.kaggle.outputs.failed_batch }}"
            python3 tools/prover.py reserve --batch "$b" && rc=0 || rc=$?
            [ "$rc" = 4 ] && exit 0
            [ "$rc" = 0 ] || exit "$rc"
            git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git config user.name "sparebrains-bot"
            git config user.email "sparebrains-bot@users.noreply.github.com"
            n=0
            python3 tools/publish.py --message "prover: the one 8B replacement for failed batch $b, reserved before its push

          Generated-by: no model; tools/prover.py reserve, cost \$0" \
              && n=$(git fetch -q origin main && git show origin/main:ledger/prover-beats/failed.jsonl | grep -F "\"batch\": \"$b\"" | grep -cF '"replacement"' || true)
            git config --unset-all http.https://github.com/.extraheader
            ! git config --get-regexp '^http\..*extraheader'
            # Fails closed (Codex 20261024T144736458820Z, accepted 2026-10-24): if the reservation did reach main, the
            # replacement is spent with no push, and a person dispatches the 8B with push; if not, the next run reserves again.
            [ "${n:-0}" -gt 0 ] || { echo "::error::could not confirm the reservation for $b on main; nothing pushed. If it reached main the replacement is spent: a person dispatches the 8B with push. If not, the next run reserves again."; exit 1; }
          fi
          kaggle kernels push -p "$RUNNER_TEMP/kernel"
          echo "pushed batch $batch"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"

      # Show the work while it runs (Andy, 2026-10-17): every check on Kaggle posts on the stage 3 gate issue.
      - name: kumori-ai[bot] token (one hour, issues on this repo only)
        id: app
        if: always() && matrix.accel == 'gpu'      # the stage 3 gate is the bar's: the GPU leg's
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPAREBRAINS_APP_ID }}
          private-key: ${{ secrets.SPAREBRAINS_APP_KEY }}

      - name: post the status on the gate issue
        if: always() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STATE: ${{ steps.kaggle.outputs.state }}
          KSTATUS: ${{ steps.kaggle.outputs.status }}
          SUMMARY: ${{ steps.judge.outputs.summary }}
          PUSHED: ${{ steps.push.outputs.batch }}
          FAILURE: ${{ steps.kaggle.outputs.failure }}
          FAILED_BATCH: ${{ steps.kaggle.outputs.failed_batch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATE" = "running" ]; then
            what="the batch is still on the free GPUs: $KSTATUS"
          elif [ "$STATE" = "judge" ]; then
            what="the batch finished; this run judged its answers with the Lean kernel: ${SUMMARY:-see the run log}"
          elif [ "$STATE" = "push" ] && [ -n "$PUSHED" ]; then
            what="pushed batch $PUSHED to the free T4 x2"
          elif [ "$STATE" = "push" ]; then
            what="every bar problem has its samples; nothing new to push"
          elif [ "$STATE" = "failed" ] && [ "$FAILURE" = "new" ]; then
            what="batch $FAILED_BATCH ended without completing ($KSTATUS); recorded in ledger/prover-beats/failed.jsonl with whatever log Kaggle kept; a person reads it before anything is pushed again"
          elif [ "$STATE" = "failed" ] && [ "$FAILURE" = "known" ]; then
            what="batch $FAILED_BATCH is still the failed one already recorded ($KSTATUS); waiting for a person to dispatch"
          elif [ "$STATE" = "failed" ]; then
            what="the batch ended without completing ($KSTATUS) but could not be recorded this run (see the run log); the next run tries again"
          else
            what="the check did not finish cleanly (${KSTATUS:-no status}); a person reads the log before anything is pushed again"
          fi
          export NOTE_BODY="**Prover check, $(date -u '+%Y-%m-%d %H:%M') UTC.** Goedel-Prover-V2-8B: $what.

          [This run]($RUN_URL) · [the notebook, its code and log](https://www.kaggle.com/code/kumoriai/sparebrains-prover) · [every judged answer](https://sparebrains.kumori.ai/lanes)"
          python3 tools/problem_issues.py --gate-note stage3

      # One alert per failed batch (2026-10-24): the run goes red only in the job that first recorded it, after the
      # record is published; every later job passes with a notice.
      - name: alert once on a newly failed batch
        if: always() && steps.kaggle.outputs.failure == 'new'
        run: |
          echo "::error::batch ${{ steps.kaggle.outputs.failed_batch }} ended without completing; see ledger/prover-beats/failed.jsonl"
          exit 1
