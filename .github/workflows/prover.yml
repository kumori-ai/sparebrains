# Stage 3, the prover lane (DECISIONS.md 2026-10-17). Kaggle's free GPUs write the answers (tools/prover_kernel.py);
# this job keeps one Kaggle batch going at a time and judges each finished batch here, with tools/check.py as the
# sandbox user, like every other try. Every two hours: if the batch is still running, nothing happens; if it is done,
# its answers are judged (resumable: a job that runs out of time leaves the rest for the next); when every answer is
# judged, the next batch is pushed, until the bar's problems each have their 32 samples.
name: prover

on:
  schedule:
    - cron: "45 */2 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "push the next batch now, whatever the last one did (after reading its log)"
        type: boolean
        default: false

permissions:
  contents: write        # publish the ledger rows and verified proofs

concurrency:
  group: prover
  cancel-in-progress: false

jobs:
  prover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false        # no push token on disk while untrusted Lean runs

      - name: python deps
        run: python3 -m pip install -q requests "kaggle>=2.2.4"   # 2.2.4 adds `kaggle quota`, which sizes each batch

      # The Kaggle token lives only in this step and the push step; neither runs Lean.
      - name: the Kaggle batch
        id: kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then echo "state=push" >> "$GITHUB_OUTPUT"; exit 0; fi
          status=$(kaggle kernels status kumoriai/sparebrains-prover 2>&1 | tail -1 || true)
          echo "kaggle: $status"
          echo "status=$(printf '%s' "$status" | tr -d '\r' | cut -c1-200)" >> "$GITHUB_OUTPUT"
          case "$status" in
            *RUNNING*|*QUEUED*) echo "state=running" >> "$GITHUB_OUTPUT"; exit 0 ;;
            # A kernel that was never pushed reads as "Cannot access kernel ... (Permission 'kernels.get' was denied)",
            # not a 404 (first run, 2026-10-17). A bad token would still fail loudly at the push.
            *404*|*"Not Found"*|*"not found"*|*"Cannot access kernel"*) echo "no batch yet"; echo "state=push" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *COMPLETE*) ;;
            # A failed or cancelled batch is never pushed again on its own: that would spend the week's GPU
            # hours on the same failure every two hours. A person reads its log and dispatches by hand.
            *) echo "::error::Kaggle batch ended without completing: $status"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/kout"
          kaggle kernels output kumoriai/sparebrains-prover -p "$RUNNER_TEMP/kout" >/dev/null 2>&1 || true
          tail -5 "$RUNNER_TEMP/kout/"*.log 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/kout/answers.jsonl" ]; then
            echo "::error::the batch completed with no answers; read its log on Kaggle before pushing again"; exit 1
          fi
          pending=$(python3 tools/prover.py pending --answers "$RUNNER_TEMP/kout/answers.jsonl")
          echo "answers still to judge: $pending"
          if [ "$pending" != "0" ]; then echo "state=judge" >> "$GITHUB_OUTPUT"; else echo "state=push" >> "$GITHUB_OUTPUT"; fi

      - name: lean + mathlib cache + build
        if: steps.kaggle.outputs.state == 'judge'
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: judge sandbox (untrusted Lean runs as another user)
        if: steps.kaggle.outputs.state == 'judge'
        run: bash tools/judge_sandbox.sh

      - name: judge the answers
        id: judge
        if: steps.kaggle.outputs.state == 'judge'
        env:
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          python3 tools/prover.py judge --answers "$RUNNER_TEMP/kout/answers.jsonl" --max-minutes 270 | tee "$RUNNER_TEMP/judge.txt"
          echo "summary=$(tail -1 "$RUNNER_TEMP/judge.txt")" >> "$GITHUB_OUTPUT"

      # Queue and run times, once per batch (DECISIONS.md 2026-10-17): Kaggle publishes no wait times, so we
      # keep our own in ledger/prover-batches.jsonl.
      - name: record the batch's timing
        if: always() && steps.judge.outcome == 'success'
        run: python3 tools/prover.py batch-record --answers "$RUNNER_TEMP/kout/answers.jsonl" --dir "$RUNNER_TEMP/kout"

      - name: publish the ledger
        if: always() && steps.judge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.judge.outputs.summary }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          # The runner this job got (GitHub promises 4 vCPU and 16 GB on public repos, not the CPU model): one line in the commit.
          MACHINE="$(nproc) vCPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo) GB RAM, $(lsb_release -ds 2>/dev/null || uname -sr)"
          python3 tools/publish.py --message "prover batch judged: $SUMMARY

          Generated-by: Goedel-Prover-V2-8B on Kaggle (GPU T4 x2), cost \$0, via tools/prover_kernel.py; verifier Lean v4.33.1 + mathlib v4.33.1 (tools/check.py)
          Judged on: $MACHINE"

      - name: push the next batch
        id: push
        if: steps.kaggle.outputs.state == 'push'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # Goal batches (task #461) only when the repository variable PROVER_MODE is "goals": set after the
          # stage-3 bar is graded, so nothing changes the prover's inputs while it is measured.
          # The week's GPU hours used exactly (2026-10-19): the session is sized to what Kaggle says is left this
          # week, and the kernel starts a chunk only if it still fits. Under an hour left: wait for Saturday's reset.
          hours=$(python3 tools/prover.py hours)
          if [ "$hours" = "0.0" ]; then echo "under an hour of GPU quota left this week; next push after the reset"; exit 0; fi
          batch=$(python3 tools/prover.py next --out "$RUNNER_TEMP/kernel" --hours "$hours" $( [ "${{ vars.PROVER_MODE }}" = "goals" ] && echo --goals ))
          if [ -z "$batch" ]; then echo "every problem has its samples; nothing to push"; exit 0; fi
          kaggle kernels push -p "$RUNNER_TEMP/kernel"
          echo "pushed batch $batch"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"

      # Show the work while it runs (Andy, 2026-10-17): every check on Kaggle posts on the stage 3 gate issue.
      - name: kumori-ai[bot] token (one hour, issues on this repo only)
        id: app
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPAREBRAINS_APP_ID }}
          private-key: ${{ secrets.SPAREBRAINS_APP_KEY }}

      - name: post the status on the gate issue
        if: always() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STATE: ${{ steps.kaggle.outputs.state }}
          KSTATUS: ${{ steps.kaggle.outputs.status }}
          SUMMARY: ${{ steps.judge.outputs.summary }}
          PUSHED: ${{ steps.push.outputs.batch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATE" = "running" ]; then
            what="the batch is still on the free GPUs: $KSTATUS"
          elif [ "$STATE" = "judge" ]; then
            what="the batch finished; this run judged its answers with the Lean kernel: ${SUMMARY:-see the run log}"
          elif [ "$STATE" = "push" ] && [ -n "$PUSHED" ]; then
            what="pushed batch $PUSHED to the free T4 x2"
          elif [ "$STATE" = "push" ]; then
            what="every bar problem has its samples; nothing new to push"
          else
            what="the check did not finish cleanly (${KSTATUS:-no status}); a person reads the log before anything is pushed again"
          fi
          export NOTE_BODY="**Prover check, $(date -u '+%Y-%m-%d %H:%M') UTC.** Goedel-Prover-V2-8B: $what.

          [This run]($RUN_URL) · [the notebook, its code and log](https://www.kaggle.com/code/kumoriai/sparebrains-prover) · [every judged answer](https://sparebrains.kumori.ai/lanes)"
          python3 tools/problem_issues.py --gate-note stage3
