# A person's or a volunteer agent's hand-off (kumori_agents.md), checked the moment it is posted on a problem
# thread (DECISIONS.md 2026-10-08). The comment is data: tools/volunteer.py takes only the proof from
# its ```lean block, splices it onto the target's exact statement, and tools/check.py judges it as the
# sandbox user, the same judge the free models' answers face. The verdict lands in the ledger, an
# accepted proof in verified/, and kumori-ai[bot] replies on the thread with what the kernel said.
name: volunteer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write        # publish the ledger row (and verified/ on an accept)

jobs:
  check:
    # Only a hand-off, only on a problem thread, never the bot's own comments.
    if: >-
      contains(github.event.comment.body, '**sparebrains hand-off**') &&
      contains(github.event.issue.labels.*.name, 'problem') &&
      github.event.comment.user.type != 'Bot' && !github.event.issue.pull_request
    # Job-level, not workflow-level: every comment starts this workflow, the bot's own replies included,
    # and a run that its `if` skips must never take the queue's waiting slot. 2026-10-08 the bot's reply
    # on #7 replaced #10's waiting check, which GitHub then cancelled.
    concurrency:
      group: volunteer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false        # no push token on disk while untrusted Lean runs

      - name: python deps
        run: python3 -m pip install -q requests

      - name: lean + mathlib cache + build
        uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: judge sandbox (untrusted Lean runs as another user)
        run: bash tools/judge_sandbox.sh

      - name: check the hand-off
        id: check
        run: |
          python3 tools/volunteer.py --event "$GITHUB_EVENT_PATH" --reply "$RUNNER_TEMP/reply.md" --record "$RUNNER_TEMP/record.json"
          if [ -s "$RUNNER_TEMP/reply.md" ]; then echo "checked=1" >> "$GITHUB_OUTPUT"; fi
          if grep -q "The kernel accepted this" "$RUNNER_TEMP/reply.md" 2>/dev/null; then echo "accepted=1" >> "$GITHUB_OUTPUT"; fi

      # The site and the relay's open list read kumori's sparebrains_attempts, not this repo's ledger:
      # without this a volunteer's solve stayed "open" there (#12, 2026-10-08). The key lives only here.
      - name: record on the site
        if: steps.check.outputs.checked == '1'
        env:
          KUMORI_API_KEY: ${{ secrets.KUMORI_API_KEY }}
        run: |
          python3 -c "import json, os, sys; sys.path[:0] = ['.']
          from utilities.kumori_api_client import init, sparebrains_attempt
          init(); r = sparebrains_attempt(json.load(open(os.environ['RUNNER_TEMP'] + '/record.json')))
          print('recorded on the site:', r); sys.exit(0 if r else 1)"

      - name: publish the ledger
        if: steps.check.outputs.checked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          WHO: ${{ github.event.comment.user.login }}
          URL: ${{ github.event.comment.html_url }}
        run: |
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "sparebrains-bot"
          git config user.email "sparebrains-bot@users.noreply.github.com"
          python3 tools/publish.py --message "volunteer hand-off from $WHO checked

          $URL
          Verifier Lean v4.33.1 + mathlib v4.33.1 (tools/check.py), against the target's exact statement (tools/volunteer.py)"

      - name: kumori-ai[bot] token (one hour, issues on this repo only)
        if: steps.check.outputs.checked == '1'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPAREBRAINS_APP_ID }}
          private-key: ${{ secrets.SPAREBRAINS_APP_KEY }}

      - name: reply on the thread
        if: steps.check.outputs.checked == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"

      # A solved problem's thread closes, as a relay solve's does; the issues workflow's refill then opens
      # the next problem in the stage-2 order (first found 2026-10-08: #12 stayed open after a volunteer solve).
      - name: close the solved thread
        if: steps.check.outputs.accepted == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
