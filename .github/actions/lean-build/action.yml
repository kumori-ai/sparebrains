# Lean + Mathlib cache + build, with one retry (2026-11-08). lean-action always installs elan by downloading it
# from GitHub's releases with a plain curl, no retry (elan-init.sh, ELAN_UPDATE_ROOT fixed in the script); on
# 2026-11-08 a 504 there failed attempt 42466336624 and tactics 42470456174 in their first minute. A failed first
# try waits 60 s and runs lean-action once more; a real build error fails twice and the job fails as before.
# `fail-first` is the canary: it points the first try at a directory that does not exist, so the retry must run.
name: lean-build
description: leanprover/lean-action v1.6.0 (no GitHub cache, Mathlib cache on), retried once
inputs:
  fail-first:
    description: "canary only: make the first try fail so the retry path runs"
    default: "false"
runs:
  using: composite
  steps:
    - name: lean (first try)
      id: first
      continue-on-error: true
      uses: leanprover/lean-action@v1.6.0
      with:
        auto-config: false
        build: true
        use-mathlib-cache: true
        use-github-cache: false
        lake-package-directory: ${{ inputs.fail-first == 'true' && 'no-such-dir-canary' || '.' }}
    - name: lean (retry after 60 s)
      if: steps.first.outcome == 'failure'
      shell: bash
      run: echo "::warning::lean-action failed on its first try; retrying once in 60 s" && sleep 60
    - name: lean (second try)
      if: steps.first.outcome == 'failure'
      uses: leanprover/lean-action@v1.6.0
      with:
        auto-config: false
        build: true
        use-mathlib-cache: true
        use-github-cache: false
